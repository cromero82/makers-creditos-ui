<section>
  <h1>Nueva solicitud</h1>
  <form [formGroup]="form" (ngSubmit)="enviar()">
    <label>
      Monto
      <input type="number" min="0.01" step="0.01" formControlName="monto" />
    </label>
    @if (form.controls.monto.touched && form.controls.monto.invalid) {
      <span class="error">Indica un monto mayor a cero</span>
    }
    <label>
      Plazo en meses
      <input type="number" min="1" max="360" formControlName="plazoMeses" />
    </label>
    @if (form.controls.plazoMeses.touched && form.controls.plazoMeses.invalid) {
      <span class="error">El plazo debe estar entre 1 y 360 meses</span>
    }
    @if (error()) {
      <p class="error">{{ error() }}</p>
    }
    <button type="submit">Enviar solicitud</button>
  </form>
</section>
